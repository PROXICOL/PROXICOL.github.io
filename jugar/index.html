  // ------------------------------------------------------------------ drawing
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function shapeGlyph(shape, cx, cy, s, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    if (shape === 'circle') ctx.arc(cx, cy, s * 0.5, 0, Math.PI * 2);
    else if (shape === 'square') ctx.rect(cx - s * 0.45, cy - s * 0.45, s * 0.9, s * 0.9);
    else { ctx.moveTo(cx, cy - s * 0.55); ctx.lineTo(cx + s * 0.55, cy + s * 0.42); ctx.lineTo(cx - s * 0.55, cy + s * 0.42); ctx.closePath(); }
    ctx.fill();
  }

  function hazardStripe(x, y, w, h, phase = 0) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.fillStyle = C.hazard;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = C.stripe;
    for (let i = -h * 2; i < w + h * 2; i += h * 1.6) {
      const sx = x + i + (phase % (h * 1.6));
      ctx.beginPath();
      ctx.moveTo(sx, y + h);
      ctx.lineTo(sx + h * 0.8, y + h);
      ctx.lineTo(sx + h * 1.6, y);
      ctx.lineTo(sx + h * 0.8, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // text in a given font, shrunk until it fits maxW
  function fitFont(text, family, size, maxW) {
    ctx.font = `${size}px ${family}`;
    const w = ctx.measureText(text).width;
    if (w > maxW) { size = Math.floor(size * maxW / w); ctx.font = `${size}px ${family}`; }
    return size;
  }

  function pill(text, x, y, size, col, bg) {
    fitFont(text, BODY, size, W - 80);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + 36;
    roundRect(x - w / 2, y - size * 0.85, w, size * 1.7, size * 0.85);
    ctx.fillStyle = bg || 'rgba(10,12,16,0.82)';
    ctx.fill();
    ctx.fillStyle = col || C.ink;
    ctx.fillText(text, x, y + 1);
  }

  function drawCrate(c) {
    ctx.save();
    if (c.falling) {
      // stretch while falling, so the kick reads as a fast drop
      const sy = 1 + Math.min(0.35, c.vy / 3200);
      ctx.translate(c.x, c.y - CRATE / 2);
      ctx.scale(1 / sy, sy);
      ctx.translate(-c.x, -(c.y - CRATE / 2));
    }
    const x = c.x - CRATE / 2;
    const y = c.y - CRATE;
    if (c.kind === KIND.BOMB) {
      ctx.fillStyle = C.bomb;
      ctx.beginPath();
      ctx.arc(c.x, c.y - CRATE / 2, CRATE * 0.48, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = C.red;
      ctx.lineWidth = 4;
      ctx.stroke();
      if (spooky()) {
        const cx = c.x, cy = c.y - CRATE / 2;
        ctx.fillStyle = C.red;
        ctx.beginPath(); ctx.arc(cx, cy - 2, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(cx - 6, cy + 4, 12, 7);
        ctx.fillStyle = C.bomb;
        ctx.beginPath(); ctx.arc(cx - 4, cy - 2, 3, 0, Math.PI * 2); ctx.arc(cx + 4, cy - 2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(cx - 3, cy + 6, 1.5, 5); ctx.fillRect(cx + 1.5, cy + 6, 1.5, 5);
      } else {
        ctx.fillStyle = C.red;
        ctx.font = `22px ${DISPLAY}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', c.x, c.y - CRATE / 2 + 2);
      }
      const flick = (Math.sin(performance.now() / 60 + c.id) + 1) / 2;
      ctx.fillStyle = flick > 0.5 ? C.gold : '#ff7a3d';
      ctx.beginPath();
      ctx.arc(c.x + 14, c.y - CRATE - 4, 4 + flick * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    if (c.kind === KIND.HEAVY) { drawHeavy(c, x, y); ctx.restore(); return; }
    if (c.kind === KIND.MYSTERY) { drawMystery(c, x, y); ctx.restore(); return; }
    if (c.kind === KIND.POWER) { drawPower(c, x, y); ctx.restore(); return; }
    const col = c.kind === KIND.GOLD ? C.gold : CRATE_COL[c.kind];
    roundRect(x, y, CRATE, CRATE, 7);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();
    // inner frame of the crate
    roundRect(x + 5, y + 5, CRATE - 10, CRATE - 10, 4);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (c.kind === KIND.GOLD) {
      // a glint sweeping across gold crates
      const g = (performance.now() / 700 + c.id * 0.3) % 1.6;
      if (g < 1) {
        ctx.save();
        roundRect(x, y, CRATE, CRATE, 7);
        ctx.clip();
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath();
        const gx = x - 20 + g * (CRATE + 40);
        ctx.moveTo(gx, y); ctx.lineTo(gx + 10, y); ctx.lineTo(gx - 6, y + CRATE); ctx.lineTo(gx - 16, y + CRATE);
        ctx.fill();
        ctx.restore();
      }
      if (spooky()) {
        // carved face, glowing
        const cx = c.x, cy = c.y - CRATE / 2;
        ctx.fillStyle = '#3b1600';
        ctx.beginPath();
        ctx.moveTo(cx - 13, cy - 2); ctx.lineTo(cx - 5, cy - 2); ctx.lineTo(cx - 9, cy - 10);
        ctx.moveTo(cx + 13, cy - 2); ctx.lineTo(cx + 5, cy - 2); ctx.lineTo(cx + 9, cy - 10);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx - 14, cy + 4); ctx.lineTo(cx - 8, cy + 8); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx, cy + 9);
        ctx.lineTo(cx + 4, cy + 4); ctx.lineTo(cx + 8, cy + 8); ctx.lineTo(cx + 14, cy + 4);
        ctx.quadraticCurveTo(cx, cy + 18, cx - 14, cy + 4);
        ctx.fill();
        ctx.fillStyle = '#3a5a1e';
        ctx.fillRect(cx - 2, y - 6, 4, 8);
      } else {
        ctx.fillStyle = '#7a5300';
        ctx.font = `24px ${DISPLAY}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', c.x, c.y - CRATE / 2 + 2);
      }
    } else {
      shapeGlyph(SHAPE[c.kind], c.x, c.y - CRATE / 2, 20, 'rgba(255,255,255,0.92)');
    }
    ctx.restore();
  }

  // heavy crate: riveted steel with a colour band; after the first kick it is cracked and wobbles
  function drawHeavy(c, x, y) {
    const now = performance.now();
    const wob = c.hits ? Math.sin(now / 28 + c.id) * 1.6 : 0;
    const hx = x - 3 + wob, hy = y - 3, hs = CRATE + 6;
    roundRect(hx, hy, hs, hs, 6);
    ctx.fillStyle = '#7d8794';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = CRATE_COL[c.color];
    ctx.fillRect(hx + 3, hy + hs * 0.28, hs - 6, hs * 0.44);
    shapeGlyph(SHAPE[c.color], c.x + wob, c.y - CRATE / 2, 17, 'rgba(255,255,255,0.95)');
    ctx.fillStyle = '#454d57';
    for (const [rx, ry] of [[6, 6], [hs - 6, 6], [6, hs - 6], [hs - 6, hs - 6]]) { ctx.beginPath(); ctx.arc(hx + rx, hy + ry, 2.6, 0, Math.PI * 2); ctx.fill(); }
    if (c.hits) {
      ctx.strokeStyle = '#1d2228';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx + 8, hy + 3); ctx.lineTo(hx + 16, hy + 14); ctx.lineTo(hx + 12, hy + 22);
      ctx.moveTo(hx + hs - 4, hy + hs - 10); ctx.lineTo(hx + hs - 14, hy + hs - 16); ctx.lineTo(hx + hs - 20, hy + hs - 6);
      ctx.stroke();
    }
  }
  function drawMystery(c, x, y) {
    const now = performance.now();
    roundRect(x, y, CRATE, CRATE, 7);
    ctx.fillStyle = '#5b4b7a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();
    roundRect(x + 5, y + 5, CRATE - 10, CRATE - 10, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();
    const p = 0.88 + 0.12 * Math.sin(now / 140 + c.id);
    ctx.fillStyle = '#f2eaff';
    ctx.font = `${Math.round(27 * p)}px ${DISPLAY}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', c.x, c.y - CRATE / 2 + 2);
  }
  function powerIcon(kind, cx, cy, s, col) {
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    if (kind === 'slow') {          // hourglass
      ctx.beginPath();
      ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy - s); ctx.lineTo(cx, cy); ctx.closePath();
      ctx.moveTo(cx - s, cy + s); ctx.lineTo(cx + s, cy + s); ctx.lineTo(cx, cy); ctx.closePath();
      ctx.fill();
    } else if (kind === 'shield') {
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 1.1);
      ctx.quadraticCurveTo(cx + s, cy - s * 0.9, cx + s, cy - s * 0.6);
      ctx.quadraticCurveTo(cx + s * 0.9, cy + s * 0.6, cx, cy + s * 1.15);
      ctx.quadraticCurveTo(cx - s * 0.9, cy + s * 0.6, cx - s, cy - s * 0.6);
      ctx.quadraticCurveTo(cx - s, cy - s * 0.9, cx, cy - s * 1.1);
      ctx.fill();
    } else {
      ctx.font = `${Math.round(s * 1.5)}px ${DISPLAY}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('x2', cx, cy + 1);
    }
  }
  // power-up: dark crate with a pulsing glow in the power's colour
  function drawPower(c, x, y) {
    const now = performance.now();
    const col = POWER_COL[c.power];
    const pulse = 0.5 + 0.5 * Math.sin(now / 150 + c.id);
    ctx.globalAlpha = 0.18 + 0.22 * pulse;
    roundRect(x - 5, y - 5, CRATE + 10, CRATE + 10, 12);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.globalAlpha = 1;
    roundRect(x, y, CRATE, CRATE, 9);
    ctx.fillStyle = '#18202d';
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    powerIcon(c.power, c.x, c.y - CRATE / 2, 10, col);
  }

  function drawTutorial(g, now) {
    const tut = g.tutorial;
    const c = g.crates.find((x) => !x.falling);
    let hint = T('tut0');
    if (c && c.kind === KIND.GOLD) hint = T(spooky() ? 'tutGoldH' : 'tutGold');
    if (c && c.kind === KIND.BOMB) hint = T('tutBomb');
    if (tut.hold && c) {
      const k = L.tutorialTarget(g, c);
      const left = k === 0 ? 0 : (KICKER_X[k - 1] + KICKER_X[k]) / 2;
      const right = k === 2 ? W : (KICKER_X[k] + KICKER_X[k + 1]) / 2;
      const p = (Math.sin(now / 180) + 1) / 2;
      ctx.fillStyle = hazardA(0.06 + p * 0.1);
      ctx.fillRect(left, 0, right - left, H);
      // tap ripple on the bin
      ctx.strokeStyle = C.hazard;
      ctx.lineWidth = 4;
      const ring = (now / 900) % 1;
      ctx.globalAlpha = 1 - ring;
      ctx.beginPath();
      ctx.arc(KICKER_X[k], 412, 24 + ring * 46, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // bouncing arrow between belt and bin
      const ay = 314 + p * 10;
      ctx.fillStyle = C.hazard;
      ctx.beginPath();
      ctx.moveTo(KICKER_X[k] - 16, ay); ctx.lineTo(KICKER_X[k] + 16, ay); ctx.lineTo(KICKER_X[k], ay + 18);
      ctx.closePath();
      ctx.fill();
      hint = FINE_POINTER ? T('tutTapKey', { k: k + 1 }) : T('tutTap');
      pill(hint, W / 2, 510, 24, '#16181c', C.hazard);
      return;
    }
    pill(hint, W / 2, 510, 22);
  }

  function draw(dt) {
    const g = game;
    const now = performance.now();
    const sx = shake > 0 ? (Math.random() - 0.5) * 16 * shake : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * 16 * shake : 0;
    // Background, in device pixels: the pre-drawn factory copied 1:1 and only the strips around it
    // painted, so each frame touches every pixel once (cheap on phones without fast graphics).
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const cw = canvas.width;
    const ch = canvas.height;
    const bx = Math.round(curDpr * offX + sx * px);
    const by = Math.round(curDpr * offY + sy * px);
    const bw = bg ? bg.width : Math.round(W * px);
    const bh = bg ? bg.height : Math.round(H * px);
    ctx.fillStyle = C.bg;
    if (by > 0) ctx.fillRect(0, 0, cw, by);
    if (by + bh < ch) ctx.fillRect(0, by + bh, cw, ch - by - bh);
    if (bx > 0) ctx.fillRect(0, by, bx, bh);
    if (bx + bw < cw) ctx.fillRect(bx + bw, by, cw - bx - bw, bh);
    if (bg) { ctx.imageSmoothingEnabled = false; ctx.drawImage(bg, bx, by); ctx.imageSmoothingEnabled = true; }
    else { ctx.fillStyle = C.floor; ctx.fillRect(bx, by, bw, bh); }
    ctx.restore();
    ctx.save();
    if (shake > 0) ctx.translate(sx, sy);
    // Wide phones show empty strips beside the 16:9 factory: nothing is drawn outside it.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    if (spooky()) drawBats(now);
    if (frosty()) drawSnow(now);
    const bins = g ? g.bins : [0, 1, 2];
    const flashOn = g && g.shiftFlash > 0 && Math.floor(g.shiftFlash * 8) % 2 === 0;

    // tap zone highlight
    for (let k = 0; k < 3; k++) {
      if (pressFlash[k] > 0) {
        const left = k === 0 ? 0 : (KICKER_X[k - 1] + KICKER_X[k]) / 2;
        const right = k === 2 ? W : (KICKER_X[k] + KICKER_X[k + 1]) / 2;
        ctx.fillStyle = hazardA(pressFlash[k] * 0.55);
        ctx.fillRect(left, 0, right - left, H);
      }
    }

    // bins (they squash briefly when a crate lands)
    for (let k = 0; k < 3; k++) {
      const x = KICKER_X[k] - 64;
      const y = 352;
      const col = CRATE_COL[bins[k]];
      const b = binBounce[k] > 0 ? Math.sin((1 - binBounce[k] / 0.3) * Math.PI) * 0.12 : 0;
      ctx.save();
      ctx.translate(KICKER_X[k], y + 120);
      ctx.scale(1 + b, 1 - b);
      ctx.translate(-KICKER_X[k], -(y + 120));
      hazardStripe(x - 6, y - 14, 140, 12, 0);
      roundRect(x, y, 128, 120, 8);
      ctx.fillStyle = flashOn ? C.ink : col;
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(x, y + 84, 128, 36);
      shapeGlyph(SHAPE[bins[k]], KICKER_X[k], y + 44, 38, 'rgba(255,255,255,0.95)');
      if (spooky()) pumpkin(x + 6, y - 24, 15, now, k);
      if (FINE_POINTER) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = `15px ${BODY}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(KEYS[k][2].toUpperCase() + '  ·  ' + KEYS[k][0], KICKER_X[k], y + 103);
      }
      ctx.restore();
    }

    // kickers (pistons above the belt)
    for (let k = 0; k < 3; k++) {
      const x = KICKER_X[k];
      const ext = g ? g.kickAnim[k] / 0.16 : 0;
      const reach = Math.sin(Math.min(1, ext) * Math.PI) * 58;
      ctx.fillStyle = C.steel;
      roundRect(x - 34, 92, 68, 66, 8);
      ctx.fill();
      ctx.fillStyle = C.steelHi;
      ctx.fillRect(x - 34, 92, 68, 8);
      ctx.fillStyle = C.muted;
      ctx.fillRect(x - 7, 158, 14, 16 + reach);
      ctx.fillStyle = C.hazard;
      roundRect(x - 26, 172 + reach, 52, 18, 4);
      ctx.fill();
      // window indicator on the belt
      ctx.strokeStyle = hazardA(0.38);
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 2;
      const win = g ? g.window : 30;
      ctx.strokeRect(x - win - CRATE / 2, BELT_Y - CRATE - 6, (win + CRATE / 2) * 2, CRATE + 6);
      ctx.setLineDash([]);
    }

    // belt
    const spd = g && mode === 'play' ? (g.tutorial ? (g.tutorial.hold ? 0 : 120) : g.shiftFlash > 0.6 ? 0 : L.speed(g)) : 60;
    beltPhase += spd * dt;
    // belt rails and rollers are in the pre-drawn background; only the moving chevrons are drawn here
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = -40 + (beltPhase % 40); x < W; x += 40) {
      ctx.moveTo(x, BELT_Y + 6);
      ctx.lineTo(x + 10, BELT_Y + 13);
      ctx.lineTo(x, BELT_Y + 20);
    }
    ctx.stroke();

    // crates
    if (g) {
      for (const c of g.crates) if (!c.falling) drawCrate(c);
      for (const c of g.crates) if (c.falling) drawCrate(c);
    }
    // entry door and exit chute, drawn over the crates so they come out of and go into the wall
    hazardStripe(0, BELT_Y - 64, 26, 64, 0);
    hazardStripe(W - 26, BELT_Y - 64, 26, 64, 0);

    if (g && g.tutorial && mode === 'play') drawTutorial(g, now);

    // particles & floating text
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 2));
      const pop = 1 + Math.max(0, f.life - f.max + 0.12) * 3;   // quick pop when it appears
      fitFont(f.text, DISPLAY, f.size * pop, W - 60);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // HUD: score in the centre, combo meter under it, hard hats on the right
    if (g && mode !== 'title' && !window.__BELT_NOHUD__) {   // (no HUD only for store artwork)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = `${Math.round(46 * (1 + scoreBump))}px ${DISPLAY}`;
      ctx.fillStyle = g.doubleT > 0 ? POWER_COL.double : C.ink;
      ctx.fillText(String(g.score), W / 2, 12 - scoreBump * 20);
      ctx.font = `17px ${BODY}`;
      ctx.fillStyle = C.muted;
      ctx.fillText(T('bestHud', { n: Math.max(g.best, g.factory ? factoryBest(g.factory.id) : save.best) }), W / 2, 62);
      // combo meter towards the next multiplier
      const m = L.mult(g);
      const bw = 170;
      const bx = W / 2 - bw / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      roundRect(bx, 86, bw, 8, 4);
      ctx.fill();
      if (g.combo % 10 > 0) {
        ctx.fillStyle = C.hazard;
        roundRect(bx, 86, Math.max(8, bw * ((g.combo % 10) / 10)), 8, 4);
        ctx.fill();
      }
      ctx.font = `${Math.round(20 * (1 + multBump))}px ${DISPLAY}`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillStyle = m > 1 ? C.hazard : 'rgba(255,255,255,0.25)';
      ctx.fillText(`x${m}`, bx + bw + 12, 91);
      // lives: hard hats (a lost one flies off)
      for (let i = 0; i < Math.max(g.maxLives, g.lives); i++) {
        const hx = W - 40 - i * 40;
        ctx.fillStyle = i >= g.maxLives ? C.gold : i < g.lives ? C.hazard : 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.arc(hx, 40, 14, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(hx - 19, 39, 38, 6);
      }
      // Hat Collector: progress of each colour towards the next hard hat
      if (g.collectN) {
        hardHat(80, 33, 9, C.hazard, 1);
        for (let j = 0; j < 3; j++) {
          const bx2 = 98 + j * 40;
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          roundRect(bx2, 27, 34, 9, 4); ctx.fill();
          const f = Math.min(1, g.colorCount[j] / g.collectN);
          if (f > 0) { ctx.fillStyle = CRATE_COL[j]; roundRect(bx2, 27, Math.max(9, 34 * f), 9, 4); ctx.fill(); }
        }
      }
      // Colour Helmets still available this shift
      for (let j = 0; j < g.helmetsOwned; j++) hardHat(96 + j * 30, 61, 10, CRATE_COL[j], g.helmets[j] ? 1 : 0.22);
      // active power-ups
      let px2 = W - 40;
      const chip = (kind, frac) => {
        ctx.fillStyle = 'rgba(10,12,16,0.7)';
        roundRect(px2 - 26, 62, 52, 22, 6);
        ctx.fill();
        powerIcon(kind, px2 - 12, 73, 7, POWER_COL[kind]);
        if (frac !== null) {
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fillRect(px2 - 2, 70, 22, 6);
          ctx.fillStyle = POWER_COL[kind];
          ctx.fillRect(px2 - 2, 70, 22 * frac, 6);
        }
        px2 -= 58;
      };
      if (g.shield) chip('shield', null);
      if (g.slowT > 0) chip('slow', g.slowT / (6 * g.powerTime));
      if (g.doubleT > 0) chip('double', g.doubleT / (8 * g.powerTime));
      for (const h of lostHats) {
        const p = 1 - h.t / 0.7;
        const hx = W - 40 - h.i * 40 + p * 30;
        const hy = 40 - p * 60 + p * p * 90;
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(p * 2.5);
        ctx.fillStyle = C.hazard;
        ctx.beginPath();
        ctx.arc(0, 0, 14, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-19, -1, 38, 6);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }
    if (g && g.shiftFlash > 0) {
      const a = Math.min(1, g.shiftFlash * 2);
      ctx.globalAlpha = a;
      hazardStripe(0, 200, W, 44, now / 8);
      const text = T('shift');
      fitFont(text, DISPLAY, 26, W - 140);
      const tw = ctx.measureText(text).width + 40;
      ctx.fillStyle = '#16181c';
      ctx.fillRect(W / 2 - tw / 2, 204, tw, 36);
      ctx.fillStyle = C.hazard;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, W / 2, 223);
      ctx.globalAlpha = 1;
    }
    if (g && g.slowT > 0 && mode === 'play') {
      ctx.fillStyle = `rgba(90,209,255,${Math.min(0.09, g.slowT * 0.03)})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (introT > 0 && mode === 'play') pill(introText, W / 2, 510, 22, '#16181c', C.hazard);
    ctx.restore(); // play-area clip
    // red flash over the whole screen after losing a life
    if (hurt > 0) {
      ctx.fillStyle = `rgba(229,72,77,${Math.min(0.32, hurt * 0.7)})`;
      ctx.fillRect(-W, -H, W * 3, H * 3);
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ loop
  function frame(now) {
    watchPerformance(now - lastT);
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (mode === 'play' && game) {
      L.update(game, dt);
      handleEvents();
      checkIntros();
      if (game && !game.tutorial) Audio.setTempo(Math.min(156, 112 + (L.speed(game) / (game.slowT > 0 ? 0.6 : 1) - 150) / 4) * (game.slowT > 0 ? 0.8 : 1));
    }
    for (let k = 0; k < 3; k++) { pressFlash[k] = Math.max(0, pressFlash[k] - dt); binBounce[k] = Math.max(0, binBounce[k] - dt); }
    shake = Math.max(0, shake - dt);
    hurt = Math.max(0, hurt - dt);
    if (mode === 'play') introT = Math.max(0, introT - dt);
    scoreBump = Math.max(0, scoreBump - dt);
    multBump = Math.max(0, multBump - dt);
    for (const p of particles) { p.life -= dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const f of floaters) { f.life -= dt; f.y -= 50 * dt; }
    floaters = floaters.filter((f) => f.life > 0);
    for (const h of lostHats) h.t -= dt;
    lostHats = lostHats.filter((h) => h.t > 0);
    if (mode === 'title' && !game) demoTick(dt);
    draw(mode === 'play' || mode === 'title' ? dt : 0);
    requestAnimationFrame(frame);
  }

  // attract mode: a self-playing belt behind the title screen
  let demo = null;
  function demoTick(dt) {
    if (!demo) demo = L.createGame({ seed: 4, factory: viewFactory });
    for (const c of demo.crates) {
      if (c.falling || c.kind === KIND.BOMB || c.kind === KIND.MYSTERY) continue;
      const k = c.kind === KIND.GOLD || c.kind === KIND.POWER ? 1 : demo.bins.indexOf(L.crateColor(c));
      if (Math.abs(c.x - KICKER_X[k]) < 5) { L.kick(demo, k); break; }
    }
    L.update(demo, dt * 0.7);
    for (const e of demo.events) if ((e.type === 'good' || e.type === 'gold') && KICKER_X.indexOf(e.x) >= 0) binBounce[KICKER_X.indexOf(e.x)] = 0.25;
    demo.events.length = 0;
    if (demo.over || demo.score > 25) demo = L.createGame({ seed: Math.floor(Math.random() * 1e6), factory: viewFactory });
  }
  const baseDraw = draw;
  draw = function (dt) {
    if (mode === 'title' && !game && demo) {
      game = demo;
      baseDraw(dt);
      game = null;
    } else {
      baseDraw(dt);
    }
  };

  // ------------------------------------------------------------------ boot
  Audio.setSong(theme);
  resize();
  I18n.apply();
  refreshMeta();
  showTitle();
  Platform.loaded();
  if (NativeAds) NativeAds.ready.then(refreshMeta);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  window.claude?.hot?.snapshot?.(() => ({ best: save.best, coins: save.coins }));
  // test hook, only present when a test harness asks for it
  if (window.__BELT_TEST__) {
    window.__belt = {
      get game() { return game; }, get mode() { return mode; }, save, press, i18n: I18n,
      get musicPlaying() { return Audio.musicPlaying; },
      get dprCap() { return dprCap; },
      get theme() { return theme; },
      get viewFactory() { return viewFactory; },
    };
  }
})();
</script>
</body></html>
