:root {
  --bg: #12161d;
  --floor: #1a2029;
  --panel: #20262f;
  --steel: #38424f;
  --steel-hi: #566273;
  --hazard: #f2b705;
  --ink: #eef1f5;
  --muted: #8e99a9;
  --crate-red: #e5484d;
  --crate-blue: #3d8bd4;
  --crate-green: #3fb768;
  --gold: #ffcf4d;
  --bomb: #22262d;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
:root.f-frozen { --bg: #0b131b; --floor: #142230; --panel: #172738; --steel: #3a5166; --steel-hi: #5b7890; --hazard: #64d4ff; --gold: #ffe07a; --muted: #93a9bb; }
:root.f-candy { --bg: #1a0e1d; --floor: #26152c; --panel: #2c1833; --steel: #583a64; --steel-hi: #7b548e; --hazard: #ff5fa2; --gold: #ffd34d; --muted: #b9a0c4; --stripe: #fff1f7; }
:root.halloween { --bg: #110d17; --floor: #1b1524; --panel: #231c2e; --steel: #3c3349; --steel-hi: #5b4e6c; --hazard: #ff7a1a; --gold: #ff9a2e; --muted: #a197b0; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.panel { position: absolute; inset: 0; display: flex; padding: 16px; background: rgba(10, 12, 16, 0.55); z-index: 2; overflow-y: auto; }
.card { width: min(440px, 100%); background: var(--panel); border: 2px solid var(--steel); border-radius: 10px; padding: 0 22px 22px; display: grid; gap: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); margin: auto; }
.split, .col { display: grid; gap: 14px; }
.card > .stripe { height: 12px; margin: 0 -22px; border-radius: 8px 8px 0 0; background: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, var(--stripe, #16181c) 14px 28px); }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; text-wrap: balance; }
h1 { font-size: clamp(42px, 9vw, 64px); letter-spacing: 1px; }
h1 span { color: var(--hazard); display: block; }
h2 { font-size: 30px; color: var(--hazard); }
p { margin: 0; color: var(--muted); line-height: 1.3; }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rule { background: var(--floor); border-radius: 8px; padding: 10px 8px; display: grid; gap: 6px; justify-items: center; text-align: center; font-size: 15px; color: var(--ink); }
.chip { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 16px; }
.chip.red { background: var(--crate-red); } .chip.gold { background: var(--gold); color: #7a5300; } .chip.bomb { background: var(--bomb); border: 3px solid var(--crate-red); border-radius: 50%; color: var(--crate-red); }
.keys { font-size: 15px; color: var(--muted); }
.keys b { color: var(--ink); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.btn { font-family: var(--display); font-size: 20px; border: 0; border-radius: 8px; padding: 14px 16px; cursor: pointer; background: var(--steel); color: var(--ink); transition: transform 0.08s ease, filter 0.1s ease; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); }
.btn:focus-visible { outline: 3px solid var(--hazard); outline-offset: 3px; }
.btn.primary { background: var(--hazard); color: #16181c; font-size: 26px; }
.btn.small { font-size: 15px; padding: 10px 12px; flex: 0 0 auto; }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; transform: none; }
.btn.ghost { background: transparent; border: 2px solid var(--steel); font-family: var(--body); font-size: 17px; }
.btn.link { display: grid; place-items: center; text-align: center; text-decoration: none; color: var(--ink); }
.meta { display: flex; justify-content: space-between; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-family: var(--display); font-weight: 400; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-variant-numeric: tabular-nums; }
.stat { background: var(--floor); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.stat span { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 28px; }
.stat.big { grid-column: 1 / -1; }
.stat.big b { font-size: 52px; color: var(--hazard); }
.badge { justify-self: start; background: var(--hazard); color: #16181c; font-family: var(--display); font-size: 14px; padding: 4px 10px; border-radius: 4px; }
.upgrade { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; background: var(--floor); border-radius: 8px; padding: 10px 12px; }
.u-text { display: grid; gap: 2px; min-width: 0; }
.u-text strong { font-family: var(--display); font-weight: 400; font-size: 17px; }
.u-text span { font-size: 15px; color: var(--muted); }
.u-pips { display: flex; gap: 4px; }
.u-pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--steel); }
.u-pips i.on { background: var(--hazard); }
#shop-list { display: grid; gap: 8px; }
#hud-pause { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); z-index: 1; width: 46px; height: 46px; padding: 0; opacity: 0.85; display: grid; place-items: center; background: rgba(18, 22, 29, 0.6); }
.pause-icon { width: 14px; height: 16px; border-left: 5px solid var(--ink); border-right: 5px solid var(--ink); box-sizing: border-box; }
.turn-hint { display: none; position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 15px; color: var(--muted); z-index: 1; pointer-events: none; }
#stage.portrait .turn-hint { display: block; }

/* title */
.title-card { width: min(420px, 100%); background: rgba(32, 38, 47, 0.94); }
.tagline { font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips:not(:has(> :not([hidden]))) { display: none; }
.season-chip { background: var(--hazard); color: #16181c; font-family: var(--display); font-size: 13px; padding: 4px 10px; border-radius: 999px; }
.streak-chip { justify-self: start; border: 2px solid var(--hazard); color: var(--hazard); font-family: var(--display); font-size: 13px; padding: 3px 10px; border-radius: 999px; }
.btn.big { font-size: 28px; padding: 16px; }
.row.three > * { flex: 1 1 0; min-width: 0; }
.row.three > .icon { flex: 0 0 52px; }
.btn.icon { display: grid; place-items: center; padding: 0; min-height: 48px; }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 6px; padding: 0 5px; border-radius: 11px; background: var(--crate-red); color: #fff; font-family: var(--body); font-weight: 600; font-size: 14px; vertical-align: 2px; }
#open-missions { white-space: nowrap; }

/* factory selector */
.factory-pick { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; background: var(--floor); border-radius: 8px; padding: 4px; }
.btn.arrow { padding: 0; height: 40px; font-size: 26px; font-family: var(--body); line-height: 1; }
.fac-text { display: grid; text-align: center; gap: 1px; min-width: 0; }
.fac-text b { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fac-text span { font-size: 14px; color: var(--muted); }
.btn.primary.locked { background: transparent; border: 2px solid var(--hazard); color: var(--hazard); }
.btn.primary.locked:disabled { opacity: 0.6; }

/* missions / achievements tabs */
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--steel); }
.tab { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 6px; color: var(--muted); font-family: var(--display); font-size: 18px; cursor: pointer; white-space: nowrap; }
.tab.active { color: var(--hazard); border-bottom-color: var(--hazard); }
.tab .count { vertical-align: 2px; }
#ach-list { display: grid; gap: 8px; max-height: min(46vh, 380px); overflow-y: auto; padding-right: 4px; }
#shop-list { max-height: min(56vh, 460px); overflow-y: auto; padding-right: 4px; }

/* game over */
.over-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn.reward { background: #2a3a2f; border: 2px solid var(--crate-green); font-family: var(--body); font-weight: 600; font-size: 19px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.btn.reward::before { content: ""; display: inline-block; width: 0; height: 0; margin-right: 8px; border-left: 11px solid var(--crate-green); border-top: 7px solid transparent; border-bottom: 7px solid transparent; vertical-align: 0; }
.btn.nav { font-family: var(--body); font-weight: 600; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; padding: 11px 6px; white-space: nowrap; }
.btn.nav .count { margin-left: 4px; }
.over-nav { gap: 8px; }
.goal { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
.goal.ready { color: var(--hazard); }
.bar { display: block; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--hazard); border-radius: 3px; }
.note { font-size: 15px; color: var(--crate-green); }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(242, 183, 5, 0.45); } }

/* missions */
#mission-list { display: grid; gap: 8px; }
.mission { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--floor); border-radius: 8px; padding: 10px 12px; }
.mission .m-text { font-size: 17px; color: var(--ink); }
.mission .m-prog { grid-column: 1; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mission .btn { grid-column: 2; grid-row: 1 / span 2; }
.mission.done .bar > i { background: var(--crate-green); }
.mission.claimed { opacity: 0.55; }

/* daily bonus */
.daily-card { width: min(400px, 100%); text-align: center; justify-items: center; }
.daily-card .btn { width: 100%; }
.daily-days { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.daily-days i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 8px; background: var(--floor); color: var(--muted); font-style: normal; font-family: var(--display); font-size: 12px; }
.daily-days i.past { background: rgba(242, 183, 5, 0.25); color: var(--ink); }
.daily-days i.today { background: var(--hazard); color: #16181c; transform: scale(1.12); }
.daily-day { font-family: var(--display); font-size: 20px; color: var(--ink); }

/* settings */
.settings { display: grid; gap: 8px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--floor); border-radius: 8px; padding: 6px 6px 6px 14px; font-size: 18px; }
.btn.toggle { min-width: 110px; font-size: 16px; padding: 9px 12px; }
.btn.toggle.off { background: transparent; border: 2px solid var(--steel); color: var(--muted); }

@media (max-width: 420px) { .rules { grid-template-columns: 1fr; } .rule { grid-template-columns: auto 1fr; justify-items: start; text-align: left; align-items: center; } }
/* Phones held sideways: the screen is short, so menus spread into two columns. */
@media (orientation: landscape) and (max-height: 560px) {
  .panel { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .card { width: min(820px, 100%); gap: 10px; padding: 0 18px 16px; }
  .card > .stripe { height: 8px; margin: 0 -18px; }
  .split { grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: center; }
  .col { gap: 8px; }
  h1 { font-size: clamp(34px, 11vh, 52px); }
  h2 { font-size: 24px; }
  p, .keys, .tagline { font-size: 15px; }
  .btn { padding: 10px 14px; font-size: 17px; }
  .btn.primary { font-size: 22px; padding: 12px 16px; }
  .btn.reward { font-size: 17px; }
  .btn.icon { min-height: 42px; }
  .stat { padding: 7px 10px; }
  .stat b { font-size: 22px; }
  .stat.big b { font-size: 40px; }
  .upgrade { padding: 8px 12px; }
  .title-card { width: min(440px, 100%); }
  .title-card h1 span { display: inline; }
  .btn.big { font-size: 24px; padding: 12px; }
  #panel-pause .card, .daily-card { width: min(520px, 100%); }
  #shop-list, #mission-list { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  #panel-shop .upgrade { grid-template-columns: 1fr auto; align-content: space-between; }
  #panel-shop .u-text { grid-column: 1 / -1; }
  .mission { grid-template-columns: 1fr; align-content: space-between; }
  .mission .btn { grid-column: 1; grid-row: auto; }
  #panel-settings .card { width: min(620px, 100%); }
  .settings { grid-template-columns: 1fr 1fr; }
  .setting { font-size: 16px; }
  .btn.toggle { min-width: 90px; font-size: 15px; padding: 7px 10px; }
  .daily-days i { width: 34px; height: 34px; }
  .factory-pick { padding: 2px; }
  .btn.arrow { height: 34px; }
  .fac-text b { font-size: 15px; }
  .fac-text span { font-size: 12px; }
  .tab { font-size: 16px; padding: 6px 4px; }
  #ach-list { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); max-height: 46vh; }
  #shop-list { max-height: 52vh; }
}
@media (orientation: landscape) and (max-height: 400px) {
  #panel-shop p, #panel-missions p, .tagline { display: none; }
  .split { gap: 14px; }
  #panel-over .card { gap: 8px; }
  #panel-over .col { gap: 6px; }
  #panel-over .stats { gap: 6px; }
  #panel-over .stat { padding: 5px 10px; }
  #panel-over .stat span { font-size: 11px; letter-spacing: 1px; }
  #panel-over .stat b { font-size: 18px; }
  #panel-over .stat.big b { font-size: 30px; }
  #panel-over .btn { padding: 8px 12px; }
  #panel-over .btn.primary { padding: 10px 12px; font-size: 20px; }
  #panel-over .btn.nav { font-size: 15px; padding: 8px 4px; }
  #panel-over h2 { font-size: 20px; }
  .goal, .note { font-size: 13px; }
  #ach-list { max-height: 38vh; }
  #shop-list { max-height: 40vh; }
  #panel-missions .card, #panel-shop .card { gap: 7px; }
  .tab { font-size: 15px; padding: 4px; }
  #panel-settings .card { gap: 7px; }
  #panel-settings h2 { font-size: 20px; }
  .settings { gap: 6px; }
  .setting { padding: 3px 4px 3px 12px; font-size: 15px; }
  .btn.toggle { padding: 5px 10px; font-size: 14px; }
  #panel-settings .row .btn, #settings-back { padding: 8px 12px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

<div id="stage">
  <canvas id="game" aria-label="Belt Panic game area. Press 1, 2 or 3 (or tap the left, middle or right third) to kick a crate into the bin below."></canvas>
  <button type="button" id="hud-pause" class="btn ghost icon" data-i18n-label="pause" hidden><i class="pause-icon"></i></button>
  <div class="turn-hint" data-i18n="turn"></div>

  <section class="panel" id="panel-title">
    <div class="card title-card">
      <div class="stripe"></div>
      <h1>BELT <span>PANIC</span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="chips"><span class="season-chip" id="season-chip" data-i18n="seasonChip" hidden></span><span class="streak-chip" id="streak-chip" hidden></span></div>
      <div class="factory-pick">
        <button type="button" class="btn ghost arrow" id="fac-prev" data-i18n-label="prevFactory">&#8249;</button>
        <div class="fac-text"><b id="fac-name"></b><span id="fac-info"></span></div>
        <button type="button" class="btn ghost arrow" id="fac-next" data-i18n-label="nextFactory">&#8250;</button>
      </div>
      <button type="button" class="btn primary big" id="play" data-i18n="play"></button>
      <div class="row three">
        <button type="button" class="btn" data-open-shop id="open-shop-title" data-i18n="upgrades"></button>
        <button type="button" class="btn" id="open-missions"><span data-i18n="missions"></span><b class="count" id="missions-badge" hidden></b></button>
        <button type="button" class="btn ghost icon" id="open-settings" data-i18n-label="settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
      <div class="meta"><span><span data-i18n="best"></span> <b data-best>0</b></span><span><span data-i18n="coins"></span> <b data-coins>0</b></span></div>
    </div>
  </section>

  <section class="panel" id="panel-over" hidden>
    <div class="card">
      <div class="stripe"></div>
      <div class="over-head"><h2 data-i18n="over"></h2><span class="badge" id="over-newbest" data-i18n="newBest" hidden></span></div>
      <div class="split">
        <div class="col">
          <div class="stats">
            <div class="stat big"><span data-i18n="score"></span><b id="over-score">0</b></div>
            <div class="stat"><span data-i18n="sorted"></span><b id="over-sorted">0</b></div>
            <div class="stat"><span data-i18n="bestCombo"></span><b id="over-combo">0</b></div>
            <div class="stat"><span data-i18n="coinsEarned"></span><b id="over-coins">+0</b></div>

          </div>
        </div>
        <div class="col">
          <button type="button" class="btn reward" id="continue" data-i18n="continueAd" hidden></button>
          <button type="button" class="btn reward" id="double" data-i18n="doubleAd" hidden></button>
          <button type="button" class="btn primary" id="again" data-i18n="next"></button>
          <div class="row three over-nav">

        <button type="button" class="tab" id="tab-ach" role="tab"><span data-i18n="achievements"></span><b class="count" id="tab-ach-count" hidden></b></button>
      </div>
      <div id="sec-missions">

      </div>

      <div class="meta"><span id="missions-streak"></span><span><span data-i18n="coins"></span> <b data-coins>0</b></span></div>
      <button type="button" class="btn" id="missions-back" data-i18n="back"></button>
    </div>
  </section>

  <section class="panel" id="panel-daily" hidden>
    <div class="card daily-card">
      <div class="stripe"></div>
      <h2 data-i18n="dailyTitle"></h2>
      <div class="daily-days" id="daily-days"></div>
      <p class="daily-day" id="daily-day"></p>
      <p data-i18n="dailyText"></p>
      <button type="button" class="btn reward" id="daily-double" hidden></button>
      <button type="button" class="btn primary" id="daily-claim"></button>
    </div>
  </section>

  <section class="panel" id="panel-settings" hidden>
    <div class="card">
      <div class="stripe"></div>
      <h2 data-i18n="settingsTitle"></h2>
      <div class="settings">

        <div class="setting"><span data-i18n="music"></span><button type="button" class="btn toggle" id="set-music"></button></div>
        <div class="setting"><span data-i18n="vibration"></span><button type="button" class="btn toggle" id="set-vibration"></button></div>
        <div class="setting"><span data-i18n="language"></span><button type="button" class="btn toggle" id="set-language"></button></div>
        <div class="setting" hidden><span data-i18n="theme"></span><button type="button" class="btn toggle" id="set-theme"></button></div>
      </div>
      <div class="row">
        <button type="button" class="btn" id="set-howto" data-i18n="howTo"></button>
        <button type="button" class="btn ghost" id="set-privacy" data-i18n="privacy" hidden></button>
        <a class="btn ghost link" id="set-policy" href="https://proxicol.github.io/privacy.html" target="_blank" rel="noopener" data-i18n="policy"></a>
      </div>
      <button type="button" class="btn" id="settings-back" data-i18n="back"></button>
    </div>
  </section>

  <section class="panel" id="panel-pause" hidden>
    <div class="card">
      <div class="stripe"></div>
      <h2 data-i18n="pauseTitle"></h2>
      <button type="button" class="btn primary" id="resume" data-i18n="resume"></button>
      <button type="button" class="btn ghost" id="quit" data-i18n="quit"></button>
    </div>
  </section>
</div>

</script><script>// Belt Panic — game rules. Pure logic: no DOM, no canvas, so it can be tested in Node.
// World is 960 x 540 logical units. Crates ride a belt left -> right; three kickers
// punch them down into the bin underneath. Match crate colour to bin colour.

const W = 960;
const BELT_Y = 262;
const KICKER_X = [300, 520, 740];
const CRATE = 46;

const KIND = { RED: 0, BLUE: 1, GREEN: 2, GOLD: 3, BOMB: 4, HEAVY: 5, MYSTERY: 6, POWER: 7 };
const POWERS = ['slow', 'shield', 'double'];
// mystery crates show their colour once they reach this x (before the first kick window)
const REVEAL_X = 205;

// Factories: each one changes the pace, the pay and when the new crates show up.
const FACTORIES = [
  { id: 'classic', cost: 0, speed: 1, coins: 1, gold: 1, powerAt: 15, heavyAt: 40, mysteryAt: 70 },
  { id: 'frozen', cost: 1500, speed: 1.1, coins: 1.3, gold: 1, powerAt: 15, heavyAt: 40, mysteryAt: 30 },
  { id: 'candy', cost: 4000, speed: 1.2, coins: 1.6, gold: 2, powerAt: 15, heavyAt: 25, mysteryAt: 60 },
];
function factoryById(id) { return FACTORIES.find((f) => f.id === id) || FACTORIES[0]; }

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function createGame(opts = {}) {
  const up = opts.upgrades || {};
  const rand = mulberry32(opts.seed ?? (Date.now() & 0xffffffff));
  return {
    rand,
    t: 0,
    score: 0,
    best: opts.best || 0,
    combo: 0,
    maxCombo: 0,
    lives: 3 + (up.lives || 0),
    maxLives: 3 + (up.lives || 0),
    sorted: 0,
    goldCaught: 0,
    bombsDodged: 0,
    over: false,
    continued: false,
    speedMul: up.slowStart ? 0.85 : 1,
    window: 30 * (1 + 0.2 * (up.wide || 0)),
    factory: factoryById(opts.factory),
    luck: up.luck || 0,                       // more gold crates and power-ups
    powerTime: 1 + 0.25 * (up.powerTime || 0),
    coinBonus: up.coinBonus || 0,             // +10% coins per level
    slowT: 0,                                 // slow-motion seconds left
    doubleT: 0,                               // double-points seconds left
    shield: false,                            // blocks the next mistake
    heavyBroken: 0,
    powersUsed: 0,
    // Hat Collector: sorting this many crates of EVERY colour earns a hard hat (0 = not bought)
    collectN: [0, 15, 12, 9][up.collector || 0],
    colorCount: [0, 0, 0],
    hatCap: 3 + (up.lives || 0) + 2,         // up to two spare hats above the normal maximum
    hatsEarned: 0,
    // Colour Helmets: one forgiven mistake per colour and shift (red, then blue, then green)
    helmets: [0, 1, 2].map((c) => (up.helmets || 0) > c),
    helmetsOwned: up.helmets || 0,
    crates: [],
    nextId: 1,
    spawnIn: 0.6,
    bins: [0, 1, 2],              // colour of the bin under each kicker
    nextShift: 30,
    shiftFlash: 0,
    kickAnim: [0, 0, 0],
    events: [],                   // consumed by the renderer each frame
    // first-run tutorial: one crate at a time, it waits under the right kicker, mistakes are free
    tutorial: opts.tutorial ? { step: 0, hold: false } : null,
  };
}

const TUTORIAL_STEPS = [KIND.RED, KIND.BLUE, KIND.GREEN, KIND.GOLD, KIND.BOMB];
const TUTORIAL_SPEED = 120;

/** Kicker a tutorial crate waits under: the bin of its colour, the middle one for gold. */
function tutorialTarget(g, c) {
  if (c.kind === KIND.GOLD) return 1;
  if (c.kind === KIND.BOMB) return -1;
  return g.bins.indexOf(c.kind);
}

function tutorialAdvance(g) {
  g.tutorial.step += 1;
  g.tutorial.hold = false;
  g.spawnIn = 0.5;
  if (g.tutorial.step >= TUTORIAL_STEPS.length) {
    g.tutorial = null;
    g.spawnIn = 1.4;
    emit(g, 'tutorialDone', {});
  } else {
    emit(g, 'tutorialStep', { step: g.tutorial.step });
  }
}

function tutorialRetry(g, reason, x) {
  g.combo = 0;
  g.tutorial.hold = false;
  g.spawnIn = 0.6;
  emit(g, 'tutorialRetry', { reason, x });
}

function speed(g) {
  const s = Math.min(g.score, 400);
  const f = g.factory ? g.factory.speed : 1;
  return 150 * g.speedMul * f * (1 + s / 230) * (g.slowT > 0 ? 0.6 : 1);
}

function spawnGap(g) {
  return Math.max(0.42, 1.25 - g.score * 0.0045) * (0.85 + g.rand() * 0.5);
}

/** Next crate on the belt. New kinds join as the score climbs (thresholds depend on the factory). */
function pickCrate(g) {
  const f = g.factory, s = g.score;
  const color = () => Math.floor(g.rand() * 3);
  if (s >= f.powerAt && g.rand() < 0.035 * (1 + 0.3 * g.luck)) {
    return { kind: KIND.POWER, power: POWERS[Math.floor(g.rand() * POWERS.length)] };
  }
  const r = g.rand();
  const bombP = s >= 8 ? 0.13 : 0;
  const goldP = s >= 5 ? (s >= 8 ? 0.04 : 0.17) * f.gold * (1 + 0.15 * g.luck) : 0;
  const heavyP = s >= f.heavyAt ? 0.08 : 0;
  const mysteryP = s >= f.mysteryAt ? 0.08 : 0;
  if (r < bombP) return { kind: KIND.BOMB };
  if (r < bombP + goldP) return { kind: KIND.GOLD };
  if (r < bombP + goldP + heavyP) return { kind: KIND.HEAVY, color: color(), hits: 0 };
  if (r < bombP + goldP + heavyP + mysteryP) return { kind: KIND.MYSTERY, color: color() };
  return { kind: color() };
}

/** Colour a crate must be sorted into (null for gold, bombs and power-ups). */
function crateColor(c) {
  if (c.kind <= 2) return c.kind;
  if (c.kind === KIND.HEAVY || c.kind === KIND.MYSTERY) return c.color;
  return null;
}

function emit(g, type, data) {
  g.events.push(Object.assign({ type }, data));
}

function loseLife(g, reason, x, color) {
  if (g.tutorial) { tutorialRetry(g, reason, x); return; }
  if (color !== undefined && color !== null && g.helmets && g.helmets[color]) {   // colour helmet takes the hit
    g.helmets[color] = false;
    emit(g, 'helmetUsed', { color, reason, x });
    return;
  }
  if (g.shield) {                     // power-up: the mistake costs nothing
    g.shield = false;
    emit(g, 'shieldUsed', { reason, x });
    return;
  }
  g.lives -= 1;
  g.combo = 0;
  emit(g, 'miss', { reason, x });
  if (g.lives <= 0) {
    g.lives = 0;
    g.over = true;
    g.best = Math.max(g.best, g.score);
    emit(g, 'over', {});
  }
}

function addScore(g, pts, x) {
  if (g.doubleT > 0) pts *= 2;
  g.score += pts;
  emit(g, 'score', { pts, x });
  if (g.score >= g.nextShift) {
    g.nextShift += 30;
    // shift change: every bin gets a different colour (a derangement of 3)
    g.bins = g.rand() < 0.5 ? [g.bins[1], g.bins[2], g.bins[0]] : [g.bins[2], g.bins[0], g.bins[1]];
    g.shiftFlash = 1.6;
    // crates already on the belt were sorted for the old layout: they may leave without penalty
    for (const c of g.crates) if (!c.falling) c.grace = true;
    emit(g, 'shift', { bins: g.bins.slice() });
  }
}

function update(g, dt) {
  if (g.over) return;
  dt = Math.min(dt, 0.05);
  g.t += dt;
  g.shiftFlash = Math.max(0, g.shiftFlash - dt);
  g.slowT = Math.max(0, g.slowT - dt);
  g.doubleT = Math.max(0, g.doubleT - dt);
  for (let i = 0; i < 3; i++) g.kickAnim[i] = Math.max(0, g.kickAnim[i] - dt);
  // the belt pauses while the shift-change banner is up, so the swap is fair
  let v = g.shiftFlash > 0.6 ? 0 : speed(g);
  const tut = g.tutorial;
  if (tut) {
    v = TUTORIAL_SPEED;
    const c = g.crates.find((x) => !x.falling);
    const k = c ? tutorialTarget(g, c) : -1;
    tut.hold = !!c && k >= 0 && c.x >= KICKER_X[k];
    if (tut.hold) { c.x = KICKER_X[k]; v = 0; }
  }

  g.spawnIn -= dt;
  if (tut) {
    if (g.spawnIn <= 0 && g.crates.length === 0) {
      g.crates.push({ id: g.nextId++, kind: TUTORIAL_STEPS[tut.step], x: -CRATE, y: BELT_Y, vy: 0, falling: false, bin: -1 });
    }
  } else if (g.spawnIn <= 0 && v > 0) {
    const last = g.crates[g.crates.length - 1];
    if (!last || last.x > CRATE * 1.6) {
      g.crates.push(Object.assign({ id: g.nextId++, x: -CRATE, y: BELT_Y, vy: 0, falling: false, bin: -1 }, pickCrate(g)));
      g.spawnIn = spawnGap(g);
    }
  }

  const keep = [];
  for (const c of g.crates) {
    if (c.falling) {
      c.vy += 2400 * dt;
      c.y += c.vy * dt;
      if (c.y > BELT_Y + 150) {
        resolveDrop(g, c);
        continue;
      }
    } else {
      c.x += v * dt;
      if (c.kind === KIND.MYSTERY && c.x >= REVEAL_X) {
        c.kind = c.color;
        c.revealed = true;
        emit(g, 'reveal', { x: c.x });
      }
      if (c.x > W + CRATE) {
        if (c.kind === KIND.BOMB) {
          g.bombsDodged += 1;
          addScore(g, 1, W - 30);
          if (g.tutorial) tutorialAdvance(g);
        } else if (c.kind !== KIND.GOLD && c.kind !== KIND.POWER && !c.grace) {
          loseLife(g, 'escaped', W - 30, crateColor(c));
        }
        continue;
      }
    }
    keep.push(c);
  }
  g.crates = keep;
}

function resolveDrop(g, c) {
  const bin = c.binColor;   // colour of the bin at the moment of the kick
  if (c.kind === KIND.BOMB) {
    emit(g, 'boom', { x: KICKER_X[c.bin] });
    loseLife(g, 'bomb', KICKER_X[c.bin]);
  } else if (c.kind === KIND.GOLD) {
    g.combo += 1;
    g.goldCaught += 1;
    g.maxCombo = Math.max(g.maxCombo, g.combo);
    addScore(g, 5 * mult(g), KICKER_X[c.bin]);
    emit(g, 'gold', { x: KICKER_X[c.bin] });
    if (g.tutorial) tutorialAdvance(g);
  } else if (c.kind === KIND.POWER) {
    const t = c.power === 'slow' ? 6 : c.power === 'double' ? 8 : 0;
    if (c.power === 'slow') g.slowT = t * g.powerTime;
    else if (c.power === 'double') g.doubleT = t * g.powerTime;
    else g.shield = true;
    g.powersUsed += 1;
    emit(g, 'power', { power: c.power, x: KICKER_X[c.bin] });
  } else if (crateColor(c) === bin) {
    const heavy = c.kind === KIND.HEAVY;
    g.combo += 1;
    g.sorted += 1;
    if (heavy) g.heavyBroken += 1;
    g.maxCombo = Math.max(g.maxCombo, g.combo);
    addScore(g, mult(g) * (heavy ? 2 : 1), KICKER_X[c.bin]);
    emit(g, 'good', { x: KICKER_X[c.bin], combo: g.combo, heavy });
    if (g.collectN && !g.tutorial) {
      g.colorCount[crateColor(c)] += 1;
      if (g.colorCount.every((n) => n >= g.collectN)) {
        g.colorCount = g.colorCount.map((n) => n - g.collectN);
        if (g.lives < g.hatCap) {
          g.lives += 1;
          g.hatsEarned += 1;
          emit(g, 'hatEarned', { x: KICKER_X[c.bin] });
        }
      }
    }
    if (g.tutorial) tutorialAdvance(g);
  } else {
    loseLife(g, 'wrong', KICKER_X[c.bin], crateColor(c));
  }
}

function mult(g) {
  return 1 + Math.floor(g.combo / 10);
}

/** Player presses kicker k (0..2). Returns the kicked crate or null. */
function kick(g, k) {
  if (g.over || k < 0 || k > 2) return null;
  g.kickAnim[k] = 0.16;
  let best = null;
  let bestD = Infinity;
  for (const c of g.crates) {
    if (c.falling) continue;
    const d = Math.abs(c.x - KICKER_X[k]);
    if (d <= g.window + CRATE / 2 && d < bestD) {
      best = c;
      bestD = d;
    }
  }
  if (!best) {
    if (g.tutorial) { emit(g, 'whiff', { k }); return null; }
    g.combo = 0;   // whiffs break the combo so spamming does not pay
    emit(g, 'whiff', { k });
    return null;
  }
  if (best.kind === KIND.HEAVY && best.hits === 0) {
    // heavy crate: the first kick only dents it, the second one drops it
    best.hits = 1;
    best.x -= 6;
    emit(g, 'dent', { k, x: KICKER_X[k] });
    return best;
  }
  best.falling = true;
  best.bin = k;
  best.binColor = g.bins[k];
  best.vy = 380;
  best.x = KICKER_X[k];
  emit(g, 'kick', { k, kind: best.kind });
  return best;
}

/** One extra life after game over (e.g. after a rewarded ad). Only once per run. */
function revive(g) {
  if (!g.over || g.continued) return false;
  g.over = false;
  g.continued = true;
  g.lives = 1;
  g.crates = [];
  g.spawnIn = 1.2;
  emit(g, 'revive', {});
  return true;
}

function coinsFor(g) {
  const base = Math.floor(g.score / 4) + g.goldCaught * 2 + Math.floor(g.maxCombo / 10) * 3 + (g.heavyBroken || 0);
  const factor = (g.factory ? g.factory.coins : 1) * (1 + 0.1 * (g.coinBonus || 0));
  return Math.floor(base * factor);
}

const UPGRADES = [
  { id: 'lives', max: 3, cost: [60, 180, 600] },
  { id: 'wide', max: 3, cost: [40, 110, 260] },
  { id: 'slowStart', max: 1, cost: [90] },
  { id: 'luck', max: 3, cost: [150, 350, 700] },
  { id: 'powerTime', max: 3, cost: [100, 250, 500] },
  { id: 'coinBonus', max: 5, cost: [120, 250, 450, 700, 1000] },
  { id: 'collector', max: 3, cost: [200, 450, 900] },
  { id: 'helmets', max: 3, cost: [250, 500, 900] },
];

const API = { W, BELT_Y, KICKER_X, CRATE, KIND, POWERS, REVEAL_X, FACTORIES, factoryById, UPGRADES, TUTORIAL_STEPS, tutorialTarget, crateColor, createGame, update, kick, revive, speed, coinsFor, mult };

// no DOM, so they can be tested in Node.

// Each mission type has three tiers; the three daily slots are easy, medium and hard.
const MISSION_TYPES = {
  sort:  { targets: [25, 45, 70], total: true },   // crates sorted today, over all runs
  score: { targets: [15, 30, 50], total: false },  // score in a single run
  combo: { targets: [8, 14, 22], total: false },   // best combo in a single run
  gold:  { targets: [3, 6, 10], total: true },     // gold crates caught today
  dodge: { targets: [4, 8, 14], total: true },     // bombs let through today
  runs:  { targets: [2, 4, 6], total: true },      // shifts played today
};
const MISSION_REWARDS = [15, 25, 40];
const STREAK_REWARDS = [10, 15, 20, 25, 30, 40, 60];   // day 1..7, then stays at 60

// Run statistics a mission can read, taken from a game state.
function runStats(g) {
  return { sorted: g.sorted, score: g.score, combo: g.maxCombo, gold: g.goldCaught, dodge: g.bombsDodged, runs: 1 };
}
const STAT_FOR = { sort: 'sorted', score: 'score', combo: 'combo', gold: 'gold', dodge: 'dodge', runs: 'runs' };

function dayKey(date) {
  const d = date || new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function previousDay(key) {
  const [y, m, d] = key.split('-').map(Number);
  return dayKey(new Date(y, m - 1, d - 1));
}

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/** Three missions for a given day: same day, same missions on every device. */
function missionsFor(day) {
  let seed = hashString('belt' + day);
  const next = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const pool = Object.keys(MISSION_TYPES);
  const out = [];
  for (let tier = 0; tier < 3; tier++) {
    const type = pool.splice(Math.floor(next() * pool.length), 1)[0];
    out.push({ type, target: MISSION_TYPES[type].targets[tier], reward: MISSION_REWARDS[tier], progress: 0, claimed: false });
  }
  return out;
}

/** Makes sure save.daily holds today's missions; returns true when a new day started. */
function ensureDaily(save, day) {
  if (save.daily && save.daily.day === day && Array.isArray(save.daily.missions)) return false;
  save.daily = { day, missions: missionsFor(day) };
  return true;
}

function isDone(m) { return m.progress >= m.target; }

/**
 * Adds a run's statistics to the missions. `prev` is what was already counted for the same run
 * (a run that continued after a rewarded ad ends twice). Returns the missions completed by this call.
 */
function applyRun(save, stats, prev) {
  const done = [];
  for (const m of save.daily.missions) {
    if (isDone(m)) continue;
    const key = STAT_FOR[m.type];
    const value = stats[key] || 0;
    if (MISSION_TYPES[m.type].total) m.progress += value - ((prev && prev[key]) || 0);
    else m.progress = Math.max(m.progress, value);
    m.progress = Math.min(m.progress, m.target);
    if (isDone(m)) done.push(m);
  }
  return done;
}

/** Missions the current run would complete if it ended now, without changing the save. */
function previewRun(save, stats, prev) {
  const copy = { daily: { day: save.daily.day, missions: save.daily.missions.map((m) => Object.assign({}, m)) } };
  return applyRun(copy, stats, prev).map((m) => copy.daily.missions.indexOf(m));
}

function claimMission(save, index) {
  const m = save.daily.missions[index];
  if (!m || m.claimed || !isDone(m)) return 0;
  m.claimed = true;
  save.coins += m.reward;
  return m.reward;
}

function claimableCount(save) {
  return save.daily ? save.daily.missions.filter((m) => isDone(m) && !m.claimed).length : 0;

    const PATTERN = { light: 12, medium: 25, error: [40, 30, 60], heavy: [80, 40, 120] };
    return {
      available: !!h || web,
      buzz(kind) {
        if (!save.haptics) return;
        try {
          if (h) {
            if (kind === 'light') h.impact({ style: 'LIGHT' });
            else if (kind === 'medium') h.impact({ style: 'MEDIUM' });
            else h.vibrate({ duration: kind === 'heavy' ? 220 : 90 });
          } else if (web) {
            navigator.vibrate(PATTERN[kind] || 20);
          }
        } catch (e) { /* ignore */ }
      },
    };
  })();

  // ------------------------------------------------------------------ canvas setup
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1;
  let offX = 0;
  let offY = 0;
  // Canvas resolution: full sharpness by default; a phone that cannot keep up drops a step (remembered).
  const DPR_STEPS = [2, 1.5, 1.25, 1];
  let dprCap = DPR_STEPS.includes(save.dprCap) ? save.dprCap : 2;
  let bg = null;                 // pre-drawn floor, grid and belt frame (they never move)
  let px = 1;                    // device pixels per world unit
  let curDpr = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    scale = Math.min(r.width / W, r.height / H);
    offX = (r.width - W * scale) / 2;
    offY = (r.height - H * scale) / 2;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
    stage.classList.toggle('portrait', r.height > r.width * 1.1);
    px = dpr * scale;
    curDpr = dpr;
    buildBackground(px);
  }
  function buildBackground(k) {
    bg = document.createElement('canvas');
    bg.width = Math.max(1, Math.round(W * k));
    bg.height = Math.max(1, Math.round(H * k));
    const b = bg.getContext('2d');
    if (!b) { bg = null; return; }
    b.scale(k, k);
    b.fillStyle = C.floor;
    b.fillRect(0, 0, W, H);
    b.strokeStyle = 'rgba(255,255,255,0.035)';
    b.lineWidth = 1;
    b.beginPath();
    for (let x = 0; x <= W; x += 60) { b.moveTo(x, 0); b.lineTo(x, H); }
    for (let y = 0; y <= H; y += 60) { b.moveTo(0, y); b.lineTo(W, y); }
    b.stroke();
    if (spooky()) drawNight(b);
    if (frosty()) drawFrost(b);
    if (sweet()) drawCandy(b);
    b.fillStyle = '#0d1015';
    b.fillRect(0, BELT_Y, W, 30);
    b.fillStyle = C.steel;
    b.fillRect(0, BELT_Y + 2, W, 22);
    b.fillStyle = '#0d1015';
    b.beginPath();
    for (let x = 20; x < W; x += 64) { b.moveTo(x + 7, BELT_Y + 30); b.arc(x, BELT_Y + 30, 7, 0, Math.PI * 2); }
    b.fill();
  }
  // Halloween night: moon, stars and cobwebs (static, part of the cached background)
  function drawNight(b) {
    const glow = b.createRadialGradient(178, 64, 10, 178, 64, 95);
    glow.addColorStop(0, 'rgba(255,236,190,0.22)');
    glow.addColorStop(1, 'rgba(255,236,190,0)');
    b.fillStyle = glow;
    b.fillRect(80, 0, 200, 170);
    b.fillStyle = '#f3e6c4';
    b.beginPath(); b.arc(178, 64, 30, 0, Math.PI * 2); b.fill();
    b.fillStyle = 'rgba(160,140,110,0.35)';
    for (const [cx, cy, r] of [[168, 56, 6], [190, 72, 4.5], [182, 50, 3], [170, 76, 3.5]]) { b.beginPath(); b.arc(cx, cy, r, 0, Math.PI * 2); b.fill(); }
    b.fillStyle = 'rgba(255,255,255,0.55)';
    for (const [sx, sy, r] of [[60, 30, 1.4], [300, 22, 1.1], [390, 58, 1.3], [640, 30, 1.2], [700, 66, 1], [860, 104, 1.3], [250, 120, 1], [620, 120, 1.1], [90, 140, 1.2]]) {
      b.beginPath(); b.arc(sx, sy, r, 0, Math.PI * 2); b.fill();
    }
    cobweb(b, 0, 0, 1, 1, 92);
    cobweb(b, W, H, -1, -1, 110);
  }
  function cobweb(b, x0, y0, dx, dy, r) {
    b.save();
    b.translate(x0, y0);
    b.scale(dx, dy);
    b.strokeStyle = 'rgba(220,215,235,0.22)';
    b.lineWidth = 1.2;
    const spokes = 6;
    b.beginPath();
    for (let i = 0; i <= spokes; i++) {
      const a = (i / spokes) * Math.PI / 2;
      b.moveTo(0, 0); b.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    for (let ring = 1; ring <= 4; ring++) {
      const rr = (r * ring) / 4.3;
      for (let i = 0; i < spokes; i++) {
        const a1 = (i / spokes) * Math.PI / 2;
        const a2 = ((i + 1) / spokes) * Math.PI / 2;
        const mid = (a1 + a2) / 2;
        b.moveTo(Math.cos(a1) * rr, Math.sin(a1) * rr);
        b.quadraticCurveTo(Math.cos(mid) * rr * 0.86, Math.sin(mid) * rr * 0.86, Math.cos(a2) * rr, Math.sin(a2) * rr);
      }
    }
    b.stroke();
    b.restore();
  }
  // small hard-hat icon (HUD)
  function hardHat(cx, cy, r, col, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx - r * 1.35, cy - 1, r * 2.7, r * 0.42);
    ctx.globalAlpha = 1;
  }
  // deterministic pseudo-random numbers for static decorations
  function prand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  // Frozen Warehouse: icicles along the roof and a snowdrift on the floor
  function drawFrost(b) {
    for (let x = 6, i = 0; x < W; x += 30, i++) {
      const len = 14 + prand(i) * 30;
      b.fillStyle = 'rgba(205,238,255,0.55)';
      b.beginPath(); b.moveTo(x, 0); b.lineTo(x + 14, 0); b.lineTo(x + 7, len); b.closePath(); b.fill();
      b.fillStyle = 'rgba(255,255,255,0.5)';
      b.fillRect(x + 4, 0, 2, len * 0.55);
    }
    b.fillStyle = 'rgba(230,244,255,0.16)';
    b.beginPath();
    b.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) b.lineTo(x, 506 + Math.sin(x / 70) * 10 + prand(x) * 6);
    b.lineTo(W, H);
    b.closePath();
    b.fill();
  }
  // Candy Factory: sprinkles on the floor and two big lollipops
  function drawCandy(b) {
    const cols = ['#ff7eb6', '#7ee0ff', '#ffe066', '#a6ff8f', '#c49bff', '#ffffff'];
    for (let i = 0; i < 90; i++) {
      const x = prand(i) * W, y = prand(i + 500) * H;
      if (y > BELT_Y - 60 && y < BELT_Y + 40) continue;
      b.save();
      b.translate(x, y);
      b.rotate(prand(i + 900) * Math.PI);
      b.globalAlpha = 0.35;
      b.fillStyle = cols[i % cols.length];
      b.fillRect(-5, -1.5, 10, 3);
      b.restore();
    }
    for (const [lx, ly] of [[70, 452], [890, 452]]) {
      b.fillStyle = '#f1e4d0';
      b.fillRect(lx - 3, ly, 6, 80);
      for (let r = 34, j = 0; r > 4; r -= 6, j++) {
        b.fillStyle = j % 2 ? '#ffffff' : '#ff5fa2';
        b.beginPath(); b.arc(lx, ly, r, 0, Math.PI * 2); b.fill();
      }
    }
  }
  // falling snow in the Frozen Warehouse (animated, a few dozen flakes)
  function drawSnow(now) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 40; i++) {
      const sp = 22 + (i % 5) * 7;
      const y = ((now / 1000) * sp + prand(i) * H) % H;
      const x = (prand(i + 77) * W + Math.sin(now / 900 + i) * 14 + W) % W;
      const r = 1.2 + (i % 3) * 0.7;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }

  // a small carved pumpkin; the face glows and flickers
  function pumpkin(cx, cy, r, now, seed) {
    ctx.save();
    ctx.fillStyle = '#3a5a1e';
    ctx.fillRect(cx - 2, cy - r - 5, 4, 7);
    ctx.fillStyle = '#ff7a1a';
    for (const [ox, w] of [[-r * 0.45, 0.62], [r * 0.45, 0.62], [0, 0.7]]) {
      ctx.beginPath(); ctx.ellipse(cx + ox, cy, r * w, r * 0.92, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(120,40,0,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.32, r * 0.9, 0, 0, Math.PI * 2); ctx.stroke();
    const f = 0.75 + 0.25 * Math.sin(now / 90 + seed * 7) * Math.sin(now / 37 + seed);
    ctx.fillStyle = `rgba(255,214,90,${f})`;
    const e = r * 0.28;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.5, cy - r * 0.12); ctx.lineTo(cx - r * 0.5 + e, cy - r * 0.12); ctx.lineTo(cx - r * 0.5 + e / 2, cy - r * 0.42);
    ctx.moveTo(cx + r * 0.5, cy - r * 0.12); ctx.lineTo(cx + r * 0.5 - e, cy - r * 0.12); ctx.lineTo(cx + r * 0.5 - e / 2, cy - r * 0.42);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.55, cy + r * 0.18);
    ctx.lineTo(cx - r * 0.3, cy + r * 0.32); ctx.lineTo(cx - r * 0.15, cy + r * 0.18); ctx.lineTo(cx, cy + r * 0.34);
    ctx.lineTo(cx + r * 0.15, cy + r * 0.18); ctx.lineTo(cx + r * 0.3, cy + r * 0.32); ctx.lineTo(cx + r * 0.55, cy + r * 0.18);
    ctx.quadraticCurveTo(cx, cy + r * 0.75, cx - r * 0.55, cy + r * 0.18);
    ctx.fill();
    ctx.restore();
  }
  // bats crossing the night sky
  function drawBats(now) {
    for (let i = 0; i < 3; i++) {
      const speed = 55 + i * 18;
      const span = W + 260;
      const x = ((now / 1000) * speed + i * 420) % span - 130;
      const y = 34 + i * 22 + Math.sin(now / 600 + i * 2) * 10;
      const flap = Math.sin(now / 70 + i * 3);
      const s = 1.35 + i * 0.2;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = '#050407';
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(side * 3, -2);
        ctx.quadraticCurveTo(side * 12, -10 * flap - 4, side * 22, -6 * flap);
        ctx.quadraticCurveTo(side * 16, 2, side * 13, 1);
        ctx.quadraticCurveTo(side * 9, 0, side * 3, 4);
        ctx.fill();
      }
      ctx.fillStyle = '#ff9a2e';
      ctx.fillRect(-2.6, -2.5, 1.6, 1.6);
      ctx.fillRect(1, -2.5, 1.6, 1.6);
      ctx.restore();
    }
  }

  // frame-time watchdog: average over ~1.5 s of play, slower than ~40 fps lowers the resolution one step
  let perfSum = 0;
  let perfN = 0;
  function watchPerformance(ms) {
    if (mode !== 'play' || document.hidden || ms > 250) return;
    perfSum += ms;
    perfN += 1;
    if (perfN < 90) return;
    const avg = perfSum / perfN;
    perfSum = 0;
    perfN = 0;
    const i = DPR_STEPS.indexOf(dprCap);
    if (avg > 25 && i < DPR_STEPS.length - 1 && (window.devicePixelRatio || 1) > DPR_STEPS[i + 1]) {
      dprCap = DPR_STEPS[i + 1];
      save.dprCap = dprCap;
      persist();
      resize();
    }
  }
  window.addEventListener('resize', resize);

  // ------------------------------------------------------------------ state
  let game = null;
  let mode = 'title';           // title | play | paused | over
  let beltPhase = 0;
  let shake = 0;
  let hurt = 0;                 // red flash after losing a life
  let scoreBump = 0;
  let multBump = 0;
  let particles = [];
  let floaters = [];
  let lostHats = [];
  let pressFlash = [0, 0, 0];
  let binBounce = [0, 0, 0];
  let lastT = performance.now();
  let lastEarned = 0;
  let introText = '';
  let introT = 0;
  const INTRO = { 5: 'introHeavy', 6: 'introMystery', 7: 'introPower' };
  function checkIntros() {
    if (!game || game.tutorial) return;
    for (const c of game.crates) {
      const key = INTRO[c.kind];
      if (key && !save.seen[key] && c.x > -10) {
        save.seen[key] = 1;
        persist();
        introText = T(key);
        introT = 4.5;
        return;
      }
    }
  }

  function factoryBest(id) { return save.factoryBest[id] || (id === 'classic' ? save.best : 0); }
  function newGame(tutorial) {
    game = L.createGame({ best: factoryBest(viewFactory), upgrades: save.upgrades, factory: viewFactory, tutorial: tutorial || !save.tutorialDone });
    game.statPrev = null;       // lifetime stats already counted for this run
    game.paid = 0;              // coins already paid out for this run (a continued run ends twice)
    game.applied = null;        // run stats already counted towards missions
    game.announced = [];        // missions already announced during this run
    particles = [];
    floaters = [];
    lostHats = [];
    mode = 'play';
    save.plays += 1;
    persist();
    showPanel(null);
    Platform.start();
    Audio.startMusic();
  }

  // ------------------------------------------------------------------ effects
  function burst(x, y, col, n, spd = 260) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = spd * (0.4 + Math.random() * 0.8);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0.6 + Math.random() * 0.4, col, s: 3 + Math.random() * 4 });
    }
  }
  function floatText(x, y, text, col, size = 26, life = 0.9) { floaters.push({ x, y, text, col, size, life, max: life }); }

  function handleEvents() {
    let scored = false;
    for (const e of game.events) {
      const k = KICKER_X.indexOf(e.x);
      switch (e.type) {
        case 'kick': Audio.kick(); Haptics.buzz('light'); break;
        case 'good':
          Audio.good(e.combo);
          if (k >= 0) binBounce[k] = 0.25;
          burst(e.x, 360, CRATE_COL[game.bins[k]] || C.ink, 14);
          if (spooky()) { burst(e.x, 360, '#a855f7', 5); burst(e.x, 360, '#ff7a1a', 5); }
          if (e.combo > 0 && e.combo % 10 === 0) { floatText(e.x, 300, T('combo', { n: L.mult(game) }), C.hazard, 30); multBump = 0.4; Audio.level(); Haptics.buzz('medium'); }
          break;
        case 'score': floatText(e.x, 330, `+${e.pts}`, C.ink); scoreBump = 0.18; scored = true; break;
        case 'gold': Audio.gold(); Haptics.buzz('medium'); if (k >= 0) binBounce[k] = 0.3; burst(e.x, 360, C.gold, 26, 340); break;
        case 'boom': Audio.boom(); Haptics.buzz('heavy'); burst(e.x, 380, '#ff7a3d', 40, 420); burst(e.x, 380, '#555', 20, 200); shake = 0.45; break;
        case 'miss':
          if (e.reason !== 'bomb') { Audio.miss(); Haptics.buzz('error'); }
          if (k >= 0) binBounce[k] = 0.2;
          shake = Math.max(shake, 0.3);
          hurt = 0.45;
          lostHats.push({ i: game.lives, t: 0.7 });
          floatText(e.x, 220, e.reason === 'escaped' ? T('escaped') : e.reason === 'wrong' ? T('wrong') : T('boom'), C.red, 30);
          break;
        case 'shift': Audio.shift(); Haptics.buzz('medium'); break;
        case 'whiff': Audio.whiff(); break;
        case 'dent': Audio.clang(); Haptics.buzz('medium'); burst(e.x, 250, '#c9d1da', 10, 220); shake = Math.max(shake, 0.12); break;
        case 'reveal': Audio.whiff(); break;
        case 'power':
          Audio.reward(); Haptics.buzz('medium');
          if (k >= 0) binBounce[k] = 0.3;
          burst(e.x, 360, POWER_COL[e.power], 30, 360);
          floatText(W / 2, 228, T('pw_' + e.power), POWER_COL[e.power], 34, 1.4);
          break;
        case 'hatEarned':
          Audio.level(); Haptics.buzz('medium');
          burst(W - 40 - (game.lives - 1) * 40, 40, C.hazard, 24, 260);
          floatText(W / 2, 228, T('hatEarned'), C.hazard, 34, 1.4);
          break;
        case 'helmetUsed':
          Audio.level(); Haptics.buzz('heavy');
          burst(96 + e.color * 30, 61, CRATE_COL[e.color], 24, 260);
          floatText(e.x || W / 2, 220, T('helmetSaved'), CRATE_COL[e.color], 30);
          break;
        case 'shieldUsed':
          Audio.level(); Haptics.buzz('heavy');
          burst(W - 70, 70, POWER_COL.shield, 30, 300);
          floatText(e.x || W / 2, 220, T('shieldSaved'), POWER_COL.shield, 30);
          break;
        case 'tutorialRetry': floatText(W / 2, 225, T('tutRetry'), C.hazard, 30); Audio.miss(); Haptics.buzz('error'); if (k >= 0) binBounce[k] = 0.2; break;
        case 'tutorialDone':
          save.tutorialDone = true;
          persist();
          floatText(W / 2, 215, T('tutDone'), C.hazard, 40, 1.8);
          Audio.reward();
          Haptics.buzz('medium');
          break;
        case 'over': endRun(); break;
        default: break;
      }
    }
    game.events.length = 0;
    // announce a daily mission the moment it is completed
    if (scored && game && save.daily && !game.over) {
      for (const i of M.previewRun(save, M.runStats(game), game.applied)) {
        if (game.announced.includes(i)) continue;
        game.announced.push(i);
        floatText(W / 2, 150, T('missionDone'), C.green, 28, 1.6);
        Audio.reward();
      }
    }
  }

  // ------------------------------------------------------------------ input
  function press(k) {
    Audio.unlock();
    if (mode !== 'play' || !game) return;
    pressFlash[k] = 0.12;
    L.kick(game, k);
  }
  stage.addEventListener('pointerdown', (ev) => {
    if (ev.target !== canvas) return;
    ev.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = (ev.clientX - r.left - offX) / scale;
    const k = x < (KICKER_X[0] + KICKER_X[1]) / 2 ? 0 : x < (KICKER_X[1] + KICKER_X[2]) / 2 ? 1 : 2;
    if (mode === 'play') press(k);
  });
  window.addEventListener('keydown', (ev) => {
    const key = ev.key.toLowerCase();
    if (mode === 'play') {
      for (let k = 0; k < 3; k++) if (KEYS[k].includes(key)) { ev.preventDefault(); press(k); return; }
      if (key === 'p' || key === 'escape') pause(true);
    } else if (mode === 'paused' && (key === 'p' || key === 'escape' || key === ' ')) {
      pause(false);
    } else if ((mode === 'title' || mode === 'over') && (key === ' ' || key === 'enter') && (panelOpen('title') || panelOpen('over'))) {
      ev.preventDefault();
      Audio.unlock();
      startOrRestart();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && mode === 'play') pause(true);
    if (!document.hidden && mode === 'title' && panelOpen('title')) checkNewDay(true);
  });

  function pause(on) {
    if (on && mode === 'play') { mode = 'paused'; Platform.stop(); Audio.stopMusic(); showPanel('pause'); }
    else if (!on && mode === 'paused') { mode = 'play'; lastT = performance.now(); showPanel(null); Platform.start(); Audio.startMusic(); }
  }

  // ------------------------------------------------------------------ menus (DOM)
  const $ = (id) => document.getElementById(id);
  const panels = ['title', 'over', 'shop', 'pause', 'missions', 'daily', 'settings'];
  function showPanel(name) {
    for (const p of panels) $(`panel-${p}`).hidden = p !== name;
    $('hud-pause').hidden = name !== null;
  }
  function panelOpen(name) { return !$(`panel-${name}`).hidden; }
  let shopReturn = 'title';
  let missionsReturn = 'title';

  function refreshMeta() {
    for (const el of document.querySelectorAll('[data-best]')) el.textContent = save.best;
    for (const el of document.querySelectorAll('[data-coins]')) el.textContent = save.coins;
    const claimM = M.claimableCount(save);
    const claimA = M.achievementsClaimable(save);
    const claimable = claimM + claimA;
    for (const id of ['missions-badge', 'missions-badge-over']) { $(id).hidden = claimable === 0; $(id).textContent = claimable; }
    $('tab-missions-count').hidden = claimM === 0; $('tab-missions-count').textContent = claimM;
    $('tab-ach-count').hidden = claimA === 0; $('tab-ach-count').textContent = claimA;
    refreshFactory();
    const streak = save.streak && save.streak.count > 1 ? save.streak.count : 0;
    $('streak-chip').hidden = !streak;
    $('streak-chip').textContent = T('streakChip', { n: streak });
    const tog = (id, on, label) => { const b = $(id); b.textContent = label || (on ? T('on') : T('off')); b.classList.toggle('off', !on); b.setAttribute('aria-pressed', String(on)); };
    tog('set-sound', !save.muted);
    tog('set-music', save.music);
    tog('set-vibration', save.haptics);
    $('set-vibration').parentElement.hidden = !Haptics.available;
    tog('set-language', true, I18n.LANGS[I18n.lang]);
    $('set-privacy').hidden = !Platform.privacyRequired;
    $('set-theme').parentElement.hidden = !SEASON;
    tog('set-theme', true, spooky() ? T('themeHalloween') : T('themeClassic'));
    $('season-chip').hidden = !spooky();
  }

  function applyLanguage() {
    I18n.apply();
    refreshMeta();
    if (panelOpen('shop')) renderShop();
    if (panelOpen('missions')) renderMissions();
    if (panelOpen('over')) renderOverGoal();
  }

  function endRun() {
    mode = 'over';
    breakPending = true;
    Platform.stop();
    Platform.idle();
    Audio.stopMusic();
    const total = L.coinsFor(game);
    lastEarned = total - game.paid;
    game.paid = total;
    const fid = game.factory.id;
    const newBest = game.score > factoryBest(fid);
    save.factoryBest[fid] = Math.max(factoryBest(fid), game.score);
    save.best = Math.max(save.best, game.score);

    save.coins += lastEarned;

      const pips = row.querySelector('.u-pips');
      for (let i = 0; i < u.max; i++) {
        const p = document.createElement('i');

      const btn = row.querySelector('button');
      btn.id = `buy-${u.id}`;
