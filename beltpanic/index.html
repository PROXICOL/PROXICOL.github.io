<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belt Panic · Juego para Android</title>
<meta name="description" content="Belt Panic: patea cada caja al contenedor de su color antes de que se escape. Juego arcade gratis para Android.">
<meta property="og:title" content="Belt Panic">
<meta property="og:description" content="Patea cada caja al contenedor de su color. ¿Me ganas?">
<meta property="og:image" content="https://proxicol.github.io/beltpanic/juego.png">
<meta property="og:type" content="website">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #12161d; --panel: #20262f; --steel: #38424f; --hazard: #f2b705; --ink: #eef1f5; --muted: #8e99a9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.45 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; }
  .stripe { height: 10px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, #16181c 14px 28px); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; text-align: center; }
  .icon { width: 84px; height: 84px; border-radius: 18px; }
  h1 { font-family: "Bungee", Impact, sans-serif; font-weight: 400; font-size: clamp(40px, 9vw, 64px); line-height: 1; margin: 14px 0 8px; }
  h1 span { color: var(--hazard); }
  p { color: var(--muted); margin: 0 auto 18px; max-width: 520px; }
  .shot { width: 100%; border-radius: 12px; border: 2px solid var(--steel); display: block; margin: 22px 0; }
  .play { display: inline-block; background: var(--hazard); color: #16181c; font-family: "Bungee", Impact, sans-serif; font-size: 20px; text-decoration: none; padding: 14px 26px; border-radius: 10px; }
  .play:hover { filter: brightness(1.08); }
  small { display: block; color: var(--muted); margin-top: 12px; font-size: 15px; }
  footer { margin-top: 36px; font-size: 15px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <img class="icon" src="../icon.png" alt="">
  <h1>BELT <span>PANIC</span></h1>
  <p>Patea cada caja al contenedor de su color antes de que se escape. Partidas de 1 a 3 minutos, gratis y sin internet.</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.proxicol.beltpanic">Jugar en Google Play</a>
  <small>Kick every crate into its bin. Free for Android.</small>
  <img class="shot" src="juego.png" alt="Belt Panic: cajas de colores en una cinta transportadora sobre tres contenedores">
  <footer>PROXICOL · <a href="../privacy.html">Política de privacidad</a></footer>
</main>
</body>
</html>
